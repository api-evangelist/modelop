entries:
  - version: '3.4-hotfix2'
    date: '2026-04-08'
    date_basis: confluence-page-version
    breaking: false
    type: fix
    page: https://modelopdocs.atlassian.net/wiki/spaces/MDHV/pages/3421798401/V3.4-hotfix2+Release+Notes
    highlights:
      - Inventory column and filter for Primary Driver, including CSV export.
      - Primary Driver added to the default Use Case Intake Form (defaults to "Unassigned").
      - Custom-metadata text search on the Inventory page filter dialog.
      - Fixed a Use Case Dashboard chart-legend DIV overrun when toggling Risk tier filters.
  - version: '3.4-hotfix1'
    date: null
    date_basis: not-captured
    breaking: false
    type: fix
    page: https://modelopdocs.atlassian.net/wiki/spaces/MDHV/pages/3356557313/V3.4-hotfix1+Release+Notes
  - version: '3.4'
    date: '2026-07-15'
    date_basis: confluence-page-version
    breaking: false
    type: feature
    page: https://modelopdocs.atlassian.net/wiki/spaces/MDHV/pages/3160309761/V3.4+Release+Notes+(LATEST)
    highlights:
      - >-
        Enhanced user experience across Inventory, MyWork, Model Details and Notifications/
        Approvals, plus a new AI "Use Case" dashboard.
      - >-
        Inventory personalization: configurable columns (including customer custom metadata
        fields), advanced AND/OR filtering across all fields, and saveable/default views.
      - Notifier "Reminder" service for outstanding issues, risks, expiring exemptions and reviews, on a configurable schedule.
      - New Java-based monitoring execution runtime for scalability and simpler troubleshooting.
      - Audit records surfaced in a "Recent Activity" section on the model page.
  - version: '3.4.3'
    date: '2025-12-19'
    date_basis: confluence-page-version
    breaking: false
    type: feature
    page: https://modelopdocs.atlassian.net/wiki/spaces/MDHV/pages/3159992590/V3.4.3+Release+Notes
    highlights:
      - Internationalization — Japanese, Spanish, Portuguese and English UI languages.
      - Custom Forms — date-selector and URL field types, tooltips, required-vs-optional fields, default values.
      - LDAP lookup to assign enterprise users to Use Case or Model fields.
      - Compliance Dashboard drill-down to the specific failing test result; test-result filters by segment.
      - PowerBI Server support (scheduled refresh/republish) and PowerBI custom form data.
    note: >-
      The page body's own "What's New" opens "ModelOp Center v3.3.3 is a minor release..." while
      the page is titled V3.4.3 — a provider-side inconsistency, recorded as observed and not
      corrected here.
