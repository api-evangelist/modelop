summary: >-
  ModelOp publishes a real, complete, publicly readable release-notes history for ModelOp Center —
  27 release-notes pages inside the documentation hub covering every release from V1 (1.6-1.10)
  through the current V3.4 and its hotfixes. Each page carries a "What's New" narrative and a
  "Full List of Enhancements" section. What it does NOT carry is a per-entry publication DATE on
  the page body: dates come only from the Confluence page version timestamp, and there is no RSS,
  Atom or JSON feed.
scheme:
  product_versioning: 'major.minor[.patch][-hotfixN]'
  api_versioning: none-in-path
  docs_versioning: >-
    One Confluence space per minor release — 11 spaces from V2.0 (VDP) through V3.4 (MDHV) — so a
    customer on an older release reads a frozen copy of that release's documentation.
  note: >-
    The API path carries no version segment; the release train is the product, not the API.
