summary: >-
  ModelOp publishes NO API rate limits. A full-text search of the current documentation space
  returns three hits for "rate limit" and all three are about the rate limits of THIRD-PARTY
  systems ModelOp integrates with (ServiceNow, Jira) or an unrelated release note — none describes
  a limit ModelOp Center itself enforces. No 429 status, no Retry-After, and no X-RateLimit-* or
  RateLimit-* response header is documented anywhere.
