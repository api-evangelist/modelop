structural_note: >-
  ModelOp Center runs inside the customer's own Kubernetes cluster, so the practical limits are
  whatever the customer's own sizing allows rather than a vendor-enforced quota. The docs do carry
  a "ModelOp Center Sizing Considerations" page
  (https://modelopdocs.atlassian.net/wiki/spaces/MDHV/pages/3159993300/ModelOp+Center+Sizing+Considerations)
  which is a capacity-planning guide, NOT a rate-limit contract, and it is not counted here.
