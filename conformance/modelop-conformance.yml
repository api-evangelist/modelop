checked: '2026-08-25'
summary: >-
  ModelOp Center conforms to the enterprise identity standards (OAuth 2.0 + OIDC, SAML 2.0) and,
  more interestingly for its market, to a set of model-representation standards it inherited from
  Open Data Group — PFA, PMML-adjacent scoring, DMN/CMMN and BPMN are all first-class model or
  workflow types in the platform's own type system. It conforms to none of the HTTP-hygiene
  standards (no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 8594 sunset headers,
  no /.well-known documents of any kind).

standards:
  - id: oauth2
    conforms: true
    evidence: >-
      "ModelOp Center integrates with OAuth 2.0 OIDC to enable enterprise-grade authentication and
      access control" — carried across the web UI, CLI, APIs and Jupyter/RStudio plugins.
      Source: MDHV/3159996285.
  - id: oidc
    conforms: true
    evidence: >-
      OAuth2 OIDC is the documented mode; five OIDC authorization servers have dedicated how-to
      pages (PingFederate, Amazon Cognito, Okta, Microsoft Entra ID, Keycloak).
      Source: MDHV/3159996790.
  - id: oidc-discovery
    conforms: false
    evidence: >-
      No /.well-known/openid-configuration is served by ModelOp — and correctly so: the
      authorization server is the CUSTOMER's IdP, not ModelOp. Recorded as non-conformance of the
      modelop.com host only, not as a product defect.
  - id: jwt
    conforms: true
    evidence: 'Supported Access Tokens: "The current architecture design supports different token formats, including: JWT". Source: MDHV/3159996285.'
  - id: saml2
    conforms: true
    evidence: >-
      SAML 2.0 IdP integration via a separately installed saml-support-service.
      Source: MDHV/3159996249 + MDHV/3159996273.
  - id: ldap
    conforms: true
    evidence: >-
      Group membership and user lookup are resolved against the enterprise Active Directory /
      LDAP; the LDAP proxy service supports standard LDAP filter syntax.
      Sources: MDHV/3159996285, MDHV/3159991960.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      No problem+json media type, error registry or error envelope is published anywhere in the
      documentation hub. The only status code named in the docs is 200.
  - id: rfc9116-security-txt
    conforms: false
    evidence: 'GET https://www.modelop.com/.well-known/security.txt -> 404 (2026-08-25).'
  - id: rfc8615-well-known
    conforms: false
    evidence: >-
      Every /.well-known/* path on www.modelop.com returns 404 with the body
      "Invalid .well-known request". See well-known/modelop-well-known.yml.
  - id: rfc9727-api-catalog
    conforms: false
    evidence: 'GET https://www.modelop.com/.well-known/api-catalog -> 404 (2026-08-25).'
  - id: rfc8594-sunset-header
    conforms: false
    evidence: No deprecation or sunset policy is published; no Deprecation/Sunset header is documented.
  - id: openapi
    conforms: partial
    evidence: >-
      ModelOp Center ships Swagger UI (springdoc, multi-group via urls.primaryName) inside every
      deployment, so an OpenAPI document demonstrably exists — the docs walk users through
      "Try it Out" against it. It is NOT published at any public URL, so no OpenAPI can be
      captured, validated or scored. Contract exists; contract is not discoverable.
  - id: llms-txt
    conforms: true
    evidence: >-
      https://www.modelop.com/llms.txt returns 200 text/plain, 7,869 bytes, correct llms.txt
      shape (H1 + blockquote summary + sectioned link lists including an "## Optional" section).
