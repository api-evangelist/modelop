# ---------------------------------------------------------------------------
# DOMAIN-STANDARD SIGNATURE (0.12.0 domain_standard_conformance)
# Read from the platform's OWN type system and workflow engine, not from a marketing claim.
# ---------------------------------------------------------------------------
domain_standards:
  market: AI/ML model governance, model risk management and model execution
  signatures:
    - id: pfa
      name: PFA — Portable Format for Analytics (Data Mining Group)
      conforms: true
      confidence: high
      evidence: >-
        `PFA`, `PFA_YAML` and `PFA_PPFA` are three of the valid StoredModel `modelMetaData.type`
        values enumerated in the docs (MDHV/3159984494), i.e. PFA is a first-class model type in
        the contract's own enum — not a prose claim. ModelOp additionally maintains the two
        reference PFA implementations in its GitHub org: `hadrian` ("Implementations of the
        Portable Format for Analytics (PFA)") and `augustus`, both inherited from Open Data Group,
        which co-authored the standard.
      spec_location: 'StoredModel modelMetaData.type enum; https://github.com/modelop/hadrian'
    - id: dmn
      name: DMN — Decision Model and Notation (OMG)
      conforms: true
      confidence: high
      evidence: '`DMN` is a valid StoredModel modelMetaData.type value (MDHV/3159984494).'
    - id: cmmn
      name: CMMN — Case Management Model and Notation (OMG)
      conforms: true
      confidence: high
      evidence: '`CMMN` is a valid StoredModel modelMetaData.type value (MDHV/3159984494).'
    - id: bpmn
      name: BPMN 2.0 (OMG)
      conforms: true
      confidence: high
      evidence: >-
        Model Life Cycles are BPMN processes executed by an embedded Camunda engine; the
        mlc-service exposes a REST action literally named "Deploying BPMNs" and gates it on group
        membership (MDHV/3159996726). The Camunda WebApp is shipped in-product.
    - id: mlflow
      name: MLflow model format
      conforms: true
      confidence: medium
      evidence: '`MLFLOW` is a valid StoredModel modelMetaData.type value (MDHV/3159984494).'
    - id: avro
      name: Apache Avro (model I/O schemas)
      conforms: true
      confidence: medium
      evidence: >-
        ModelOp maintains `python-quickavro` ("a fast Python Avro library") in its GitHub org and
        the platform manages per-model input/output Schemas as a first-class versioned asset.
    - id: scim
      conforms: false
      evidence: >-
        No SCIM user-provisioning endpoint is documented; identity comes from the customer's
        AD/LDAP through OIDC instead.

# Frameworks ModelOp's PRODUCT implements as governance templates. These describe what the
# software helps a CUSTOMER comply with. They are NOT ModelOp's own corporate certifications and
# are deliberately kept out of standards[] so they cannot be read as provider conformance.
domain_frameworks_supported:
  claim_source: https://www.modelop.com/llms.txt + https://www.modelop.com/ai-governance/ai-regulations-standards
  frameworks:
    - EU AI Act
    - US OCC SR 11-7 (model risk management)
    - NIST AI Risk Management Framework (AI RMF)
    - ISO/IEC 42001 (AI management systems)
    - OSFI E-23 (with AI extensions)
    - Annual Model Attestation
    - AI TRiSM
  note: >-
    ModelOp states 25+ out-of-the-box governance process templates covering these frameworks.
    Product capability, evidenced only by the vendor's own marketing pages.

