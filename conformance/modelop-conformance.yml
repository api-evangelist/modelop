      GPTBot, ClaudeBot, Claude-User, PerplexityBot, Google-Extended and CCBot. This is a real
      machine-readable AI-usage preference signal, expressed in robots.txt rather than in a
      /.well-known document.
  - id: mcp
    conforms: false
    evidence: No ModelOp MCP server was found on any host, in the GitHub org, or in the docs hub.
  - id: a2a
    conforms: false
