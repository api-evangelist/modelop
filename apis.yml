aid: modelop
name: ModelOp
description: >-
  ModelOp is enterprise software for governing and operationalizing artificial intelligence at
  scale. Founded as Open Data Group and headquartered in Chicago, Illinois, it sells an "AI system
  of record" — the Enterprise AI Command Center, powered by the ModelOp AI Delivery Engine (MADE)
  and delivered as ModelOp Center — that lets large regulated organizations inventory every AI
  asset, automate the model lifecycle from intake through retirement, enforce governance and
  regulatory policy, and report on cost, risk and ROI across traditional machine learning,
  generative AI and agentic AI. The platform is customer-deployed (Helm chart on Kubernetes) with
  a REST-compliant microservices architecture, a `moc` CLI, OAuth 2.0/OIDC authentication against
  the enterprise's own identity provider, and 50+ integrations spanning cloud, AI/ML platforms,
  data, BI, GRC, ITSM and security systems. Because ModelOp Center runs inside the customer's own
  infrastructure, its Swagger UI and OpenAPI document are served only from a customer instance and
  are not published at any public URL.
