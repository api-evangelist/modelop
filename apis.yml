apis:
- name: ModelOp Center REST API
  description: >-
    The REST-compliant, microservices-based API of ModelOp Center. It exposes the governance
    inventory (StoredModel entities — Use Cases and Model Implementations), snapshots (immutable
    model versions), assets, schemas, jobs, deployments, runtimes, Model Life Cycle (BPMN) signals,
    audit records and application/custom forms. ModelOp Center is customer-deployed, so the API is
    served from the customer's own base URL and its Swagger UI lives at
    <base>/swagger-ui/webjars/swagger-ui/index.html?urls.primaryName=model-manage. No OpenAPI
    document is published at a public URL, so none is captured in this repo.
  humanURL: https://modelopdocs.atlassian.net/wiki/spaces/MDHV
  baseURL: https://{modelop-base-url}/api
  x-base-url-note: >-
    TEMPLATED ON PURPOSE — do not "repair" this to www.modelop.com. ModelOp Center is
    customer-deployed software; every customer runs the API on their own host, which is what
    the docs mean by <<MODELOP-BASE-URL>> and <<YOUR-BASE-URL>>. ModelOp operates no public
    API host: api.modelop.com, developer.modelop.com and docs.modelop.com all fail DNS
    resolution (checked 2026-08-25). Substituting the marketing site would name a host that
    serves no API.
