source: >-
  Registry sweeps of PyPI (pypi.org/pypi/<pkg>/json), npm (registry.npmjs.org), RubyGems,
  crates.io, NuGet, Maven Central and pkg.go.dev for a first-party ModelOp client library,
  plus github.com/modelop (149 public repos) and the public ModelOp Documentation Hub
