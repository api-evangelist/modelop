  basis: >-
    No StatusPage pointer is emitted. ModelOp Center runs inside the customer's own infrastructure
    (Helm chart on Kubernetes), so there is no ModelOp-operated runtime whose availability a
    status page could report. This is an honest structural absence, not a gap in the vendor's
    operations posture, and it is recorded here so a later round does not "repair" it by pointing
